return `<section><div class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><h2>${r[0].toUpperCase()+r.slice(1)} dashboard</h2><button class="btn alt" data-a="logout">Switch role</button></div><div class="note">Demo: this browser plays both sides, so enquiries you send as a buyer appear here for the seller to answer. This dashboard is a demo preview and does not read from the database.</div><div class="big">${st.map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div><h3>Enquiries and negotiation</h3><div style="overflow-x:auto"><table class="rt"><tr><th>Listing</th><th>Qty</th><th>Offer</th><th>Counter</th><th>Status</th><th></th></tr>${E.map((e,n)=>`<tr><td data-l="Listing">${T(e)}</td><td data-l="Qty">${esc(e.qty)}</td><td data-l="Offer">${rs(e.offer)}</td><td data-l="Counter">${e.counter?rs(e.counter):"–"}</td><td data-l="Status"><b>${e.status||"Pending"}</b></td><td>${act(e,n)}</td></tr>`).join("")||'<tr><td colspan="6">No enquiries yet. Open a listing and send one.</td></tr>'}</table></div><h3 style="margin-top:28px">Orders</h3>${O.length?`<div style="overflow-x:auto"><table class="rt"><tr><th>Listing</th><th>Qty</th><th>Agreed price</th></tr>${O.map(e=>`<tr><td data-l="Listing">${T(e)}</td><td data-l="Qty">${esc(e.qty)}</td><td data-l="Price">${rs(e.counter||e.offer)}</td></tr>`).join("")}</table></div>`:'<p class="meta">Accepted enquiries become orders here.</p>'}<h3 style="margin-top:28px">Business profile</h3><form id="pf"><label class="f">Business name<input name="bn" value="${esc(P.bn||"")}"></label><label class="f">City<input name="bc" value="${esc(P.bc||"")}"></label><label class="f">WhatsApp<input name="bw" value="${esc(P.bw||"")}"></label><button class="btn">Save profile</button><p class="meta" id="pm" role="status"></p></form>${r==="buyer"?`<h3 style="margin-top:28px">Saved listings</h3>${store("saved").map(id=>A.find(x=>x.id===id)).filter(Boolean).map(i=>`<p><a href="#item-${i.id}">${esc(i.t)}</a> · ${rs(i.p)}</p>`).join("")||'<p class="meta">No saved listings yet. Open a listing and tap Save.</p>'}`:""}${r!=="buyer"?`<h3 style="margin-top:28px">${r==="admin"?"Manage your demo listings":"My listings"}</h3><div style="overflow-x:auto"><table class="rt">${M.map(i=>`<tr><td data-l="Listing">${esc(i.t)}</td><td data-l="Status">${i.st||"Published"}</td><td data-l="Price">${rs(i.p)}</td><td>${r==="admin"&&i.st==="Pending approval"?`<button class="btn" data-pub="${i.id}">Approve</button>`:""}${i.st!=="Archived"?`<button class="btn alt" data-arc="${i.id}">Archive</button>`:""}<button class="btn alt" data-del="${i.id}">Remove</button></td></tr>`).join("")||'<tr><td>You have not added any listings. Use Sell surplus.</td></tr>'}</table></div>`:""}</div></section>`},
how(){const B=["Create an account and complete the business profile","Search by category, city, quantity and price","Open a listing and review photos and specifications","Send an enquiry with quantity and proposed price","Negotiate price and quantity with the seller","Track the enquiry and order status"],S=["Register a business account and submit verification details","Open the seller dashboard and choose List Surplus Inventory","Upload photos, add title, category, location and quantity","Set minimum order quantity and asking price, then publish","Receive and review buyer enquiries","Accept, reject or counter-offer and manage buyers"];
return `<section><div class="wrap"><h2>How it works</h2><p class="sub">The complete journey for both sides.</p><div class="two"><div><h3>Buyer journey</h3><ol class="steps">${B.map(x=>`<li>${x}</li>`).join("")}</ol></div><div><h3>Seller journey</h3><ol class="steps">${S.map(x=>`<li>${x}</li>`).join("")}</ol></div></div>
<h2 style="margin-top:36px">Prototype status</h2><div class="note"><b>Working in this prototype:</b> landing page, marketplace search and filters, listing pages, enquiry form, sell form, demo login with buyer, seller and admin dashboards, and a basic offer, counter-offer, accept and reject flow. Enquiries, listing requests and the join form are recorded in a database when it is connected. The dashboards are demo previews saved in your browser.<br><br><b>Not built yet:</b> real accounts and passwords, dashboards that read from the database, photo upload, business verification, admin approval of listings, notifications. These need the full Next.js and Supabase build.</div></div></section>`}};
function draw(){const g=$("#g");if(!g)return;const t=$("#fq").value.toLowerCase(),c=$("#fc").value,ci=$("#fcity").value,p=+$("#fp").value||0,v=$("#fv").checked;
const r=all().filter(i=>(!t||i.t.toLowerCase().includes(t))&&(c===""||i.c==c)&&(!ci||i.city===ci)&&(!p||i.p<=p)&&(!v||i.v)&&i.st!=="Archived");
$("#cnt").textContent=r.length+" listing"+(r.length==1?"":"s");g.innerHTML=r.map(card).join("")||"<p>No listings match. Try clearing a filter.</p>"}
function route(){const h=location.hash.slice(1)||"home";
app.innerHTML=h.startsWith("item-")?pages.item(h.slice(5)):(pages[h]||pages.home)();
window.scrollTo(0,0);$("#nv").classList.remove("open");$("#mt").setAttribute("aria-expanded","false");document.title="SurplusPK – "+(h.startsWith("item-")?"Listing":h[0].toUpperCase()+h.slice(1));app.focus({preventScroll:true});
if(h==="market"){["fq","fc","fcity","fp","fv"].forEach(x=>$("#"+x).addEventListener("input",draw));$("#fc").value=cat;cat="";if(innerWidth>720)$(".fdet").open=true;draw()}
if(h==="home"){$("#hs").onsubmit=e=>{e.preventDefault();q=$("#hq").value;cat="";location.hash="#market"};
document.querySelectorAll("[data-cat]").forEach(a=>a.onclick=()=>{q="";cat=a.dataset.cat});
$("#ea").onsubmit=e=>{e.preventDefault();send("waitlist",Object.fromEntries(new FormData(e.target)),$("#eam"),e.target)}}
if(h==="sell"){const F=$("#sf"),fs=[...F.querySelectorAll("fieldset")];let n=0;
try{const d=JSON.parse(localStorage.getItem("draft")||"{}");for(const k in d)if(F.elements[k])F.elements[k].value=d[k]}catch(x){}
F.addEventListener("input",()=>{try{localStorage.setItem("draft",JSON.stringify(Object.fromEntries(new FormData(F))))}catch(x){}});
const show=()=>{fs.forEach((x,i)=>x.hidden=i!==n);$("#bk").hidden=n==0;$("#nx").hidden=n==2;$("#go").hidden=n!=2;$("#sp").textContent="Step "+(n+1)+" of 3 · draft saves automatically";$("#pb").style.width=(n+1)*33.3+"%";
 if(n==2){const f=Object.fromEntries(new FormData(F));$("#rv").innerHTML="<b>"+esc(f.t)+"</b><br>"+CATS[+f.c]+" · "+f.grade+" · "+esc(f.cond)+"<br>"+esc(f.q)+" "+f.u+" in "+f.city+" · minimum order "+esc(f.moq)+"<br>Asking "+rs(f.p||0)+" per unit"}};
$("#nx").onclick=()=>{if([...fs[n].querySelectorAll("input,select")].every(i=>i.reportValidity())){n++;show()}};
$("#bk").onclick=()=>{n--;show()};show();
F.onsubmit=async e=>{e.preventDefault();if(![...fs[2].querySelectorAll("input")].every(i=>i.reportValidity()))return;const f=Object.fromEntries(new FormData(F));
const ok=await send("listing_requests",{name:f.name,contact:f.contact,title:f.t,category:CATS[+f.c],city:f.city,qty:+f.q,unit:f.u,moq:+f.moq,price:+f.p,condition:f.grade+" · "+f.cond},$("#sm"),null);
if(ok){const m=store("mine");m.unshift({id:"m"+Date.now(),t:f.t,c:+f.c,city:f.city,q:+f.q,u:f.u,moq:+f.moq,p:+f.p,was:+f.p,cond:f.grade+" · "+f.cond,s:"Your business",v:0,d:"just now",st:"Pending approval"});store("mine",m);try{localStorage.removeItem("draft")}catch(x){}}}}
if(h.startsWith("item-")){$("#eq").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=e.target.dataset.id,it=all().find(x=>x.id===id);
const ok=await send("enquiries",{listing_id:id,listing_title:it?it.t:"",qty:+f.qty,offer:+f.offer,name:f.name,contact:f.contact,message:f.msg||""},$("#eqm"),null);
if(ok){const l=store("enq");l.push({listing:id,qty:f.qty,offer:f.offer,msg:f.msg});store("enq",l)}}}}
const getRole=()=>{try{return localStorage.getItem("role")||""}catch(x){return ""}};
app.addEventListener("submit",e=>{if(e.target.id!=="pf")return;e.preventDefault();try{localStorage.setItem("profile",JSON.stringify(Object.fromEntries(new FormData(e.target))));$("#pm").textContent="Saved in this browser."}catch(x){$("#pm").textContent="Could not save."}});
$("#mt").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#mt").setAttribute("aria-expanded",o)};
app.addEventListener("click",e=>{const b=e.target.closest("[data-role],[data-a],[data-del],[data-save],[data-pub],[data-arc]");if(!b)return;
if(b.dataset.pub||b.dataset.arc){const id=b.dataset.pub||b.dataset.arc;store("mine",store("mine").map(i=>i.id===id?{...i,st:b.dataset.pub?"Published":"Archived"}:i));route();return}
if(b.dataset.save){const l=store("saved"),k=b.dataset.save,x=l.indexOf(k);x<0?l.push(k):l.splice(x,1);store("saved",l);b.textContent=x<0?"Saved ✓":"Save listing";return}
if(b.dataset.role){try{localStorage.setItem("role",b.dataset.role)}catch(x){}location.hash="#dash";route();return}
if(b.dataset.del){store("mine",store("mine").filter(i=>i.id!==b.dataset.del));route();return}
const a=b.dataset.a;if(a==="logout"){try{localStorage.removeItem("role")}catch(x){}route();return}
const E=store("enq"),x=E[+b.dataset.n];if(!x)return;
if(a==="accept")x.status="Accepted";else if(a==="reject")x.status="Rejected";else if(a==="withdraw")x.status="Withdrawn";else if(a==="counter"){const p=prompt("Counter price per unit (Rs)",x.offer);if(!p||isNaN(p))return;x.counter=+p;x.status="Countered"}
store("enq",E);route()});
addEventListener("hashchange",route);route();
</script></body></html>
